openapi: 3.0.3
info:
  title: Synapse API
  version: 1.0.8
  description: |
    REST API для регистрации, аутентификации через JWT-куки и управления пользователями на основе ролей.

    **Аутентификация:** Токены доступа (access) и обновления (refresh) передаются в виде **HttpOnly куки**
    (`access_token`, `refresh_token`). Они **не** считываются из заголовка `Authorization`.

    Эндпоинты, помеченные схемой безопасности `cookieAuth`, требуют наличия валидной куки `access_token`.

    Флаги куки: `HttpOnly`, `Secure` (если `COOKIE_SECURE=true`), `SameSite` (Lax/Strict), `Path=/api/v1/`.

    CORS настроен с `Access-Control-Allow-Credentials: true` и явным списком разрешенных источников (origin allow-list).
servers:
  - url: /api/v1
    description: Версия 1
tags:
  - name: Auth
    description: Регистрация и сессионные эндпоинты (куки)
  - name: Users
    description: Профиль и административное управление пользователями
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: Кратковременный JWT токен доступа в HttpOnly куки. Требуется для защищенных эндпоинтов.
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: Долговременный JWT токен обновления в HttpOnly куки. Требуется для /refresh и используется в /logout.
  schemas:
    User:
      type: object
      required:
        - id
        - email
        - role
        - status
        - first_name
        - last_name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, inactive]
        first_name:
          type: string
        last_name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - error
        - message
      properties:
        error:
          type: string
          example: Validation Failed
        message:
          type: string
          example: Проверьте обязательные поля пользователя
        details:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email: ["Укажите действительный email"]
            password: ["Пароль должен содержать не менее 8 символов"]
    Message:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - first_name
        - last_name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string
    RegisterAdminRequest:
      allOf:
        - $ref: '#/components/schemas/RegisterRequest'
        - type: object
    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    CreateUserRequest:
      type: object
      required:
        - email
        - password
        - first_name
        - last_name
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum: [user, admin]
          default: user
          description: По умолчанию 'user'.
    UpdateUserRequest:
      type: object
      required:
        - email
        - password
        - first_name
        - last_name
        - status
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string
        status:
          type: string
          enum: [active, inactive]
    PatchUserRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        first_name:
          type: string
        last_name:
          type: string
        status:
          type: string
          enum: [active, inactive]
    UpdateMeRequest:
      type: object
      required:
        - email
        - first_name
        - last_name
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
    PatchMeRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
    UserListResponse:
      type: object
      required:
        - items
        - page
        - limit
        - total
        - total_pages
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          format: int64
        total_pages:
          type: integer
          format: int64
  headers:
    CacheControl:
      description: Явное управление кэшированием. Для защищенных JSON-ответов используется no-store.
      schema:
        type: string
        example: no-store, no-cache, must-revalidate, private
paths:
  /register:
    post:
      tags:
        - Auth
      summary: Регистрация стандартного пользователя
      description: Создает пользователя с ролью `user`. Не требует куки.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Пользователь создан
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email уже зарегистрирован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /register-admin:
    post:
      tags:
        - Auth
      summary: Регистрация администратора
      description: |
        Создает пользователя с ролью `admin`. Требуется секретный токен регистрации администратора 
        в заголовке `X-Admin-Token`. Не требует куки.
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: false
          schema:
            type: string
          description: Секретный токен регистрации администратора.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterAdminRequest'
      responses:
        '201':
          description: Администратор создан
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Неверный токен регистрации администратора
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /login:
    post:
      tags:
        - Auth
      summary: Вход в систему (любая роль)
      description: |
        Проверяет учетные данные и устанавливает HttpOnly куки `access_token` и `refresh_token`.
        Клиентский JavaScript не может прочитать эти куки. Используйте `credentials: include` на фронтенде.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Вход выполнен; куки установлены
          headers:
            Set-Cookie:
              description: HttpOnly куки access_token и refresh_token
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                  - user
                properties:
                  message:
                    type: string
                    example: Авторизация успешна
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /refresh:
    post:
      tags:
        - Auth
      summary: Ротация токенов доступа и обновления
      description: |
        **Требуется кука `refresh_token`.** Считывает JWT обновления, проверяет, что он не отозван 
        в базе данных, затем выпускает новую пару куки (ротация).
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Новые куки установлены
          headers:
            Set-Cookie:
              description: HttpOnly куки access_token и refresh_token
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '401':
          description: Отсутствует, истек срок действия или отозван токен обновления
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /logout:
    post:
      tags:
        - Auth
      summary: Выход из системы
      description: |
        Очищает куки токенов (устанавливает истекшие Set-Cookie) и **отзывает токен обновления на стороне сервера**
        (добавляет в черный список БД). Отправьте куку `refresh_token`, если она присутствует.
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Выход выполнен
          headers:
            Set-Cookie:
              description: Истекшие куки access_token и refresh_token для удаления
              schema:
                type: string
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /users/me:
    get:
      tags:
        - Users
      summary: Получение собственного профиля
      description: Требуется кука `access_token`. Доступно ролям `user` и `admin`.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Текущий пользователь
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          description: Отсутствует или неверна кука токена доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Users
      summary: Полная замена собственного профиля
      description: Доступно авторизованным пользователям. Роль и статус изменять через этот эндпоинт нельзя.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
      responses:
        '200':
          description: Профиль обновлен
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email уже используется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Users
      summary: Частичное обновление собственного профиля
      description: Обновляет только переданные поля; роль и статус недоступны для изменения.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMeRequest'
      responses:
        '200':
          description: Профиль обновлен
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации или не переданы поля для обновления
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email уже используется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users:
    get:
      tags:
        - Users
      summary: Список всех пользователей
      description: Требуется кука `access_token`. Только роль `admin`.
      security:
        - cookieAuth: []
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
          description: Номер страницы
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
          description: Количество элементов на странице
        - in: query
          name: search
          schema:
            type: string
          description: Поиск по email, имени и фамилии
        - in: query
          name: role
          schema:
            type: string
            enum: [user, admin]
          description: Фильтр по роли
        - in: query
          name: status
          schema:
            type: string
            enum: [active, inactive]
          description: Фильтр по статусу
      responses:
        '200':
          description: Страница пользователей
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '400':
          description: Ошибка валидации параметров запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Отсутствует или неверна кука токена доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Не администратор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags:
        - Users
      summary: Создание пользователя администратором
      description: Требуется кука `access_token`. Только роль `admin`. Новый пользователь получает статус `active`.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Пользователь создан
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Не администратор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email уже используется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /users/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema:
          type: string
          format: uuid
        description: UUID пользователя
    get:
      tags:
        - Users
      summary: Получение пользователя по ID
      description: Требуется кука `access_token`. Только роль `admin`.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Пользователь
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Неверный формат UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Отсутствует или неверна кука токена доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Не администратор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags:
        - Users
      summary: Полная замена данных пользователя
      description: Требуется кука `access_token`. Только роль `admin`. Полная замена редактируемых данных. Существующая роль сохраняется; переданное поле `role` игнорируется.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: Данные пользователя обновлены
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Отсутствует или неверна кука токена доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Не администратор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email уже используется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags:
        - Users
      summary: Частичное обновление данных пользователя
      description: Требуется кука `access_token`. Только роль `admin`. Обновляет только переданные поля. Существующая роль сохраняется; переданное поле `role` игнорируется.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
      responses:
        '200':
          description: Данные пользователя обновлены
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Отсутствует или неверна кука токена доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Не администратор
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email уже используется
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags:
        - Users
      summary: Удаление пользователя
      description: |
        Требуется кука `access_token`. Только роль `admin`. 
        Удаление запрещено, если целевая учетная запись принадлежит администратору или совпадает с учетной записью текущего администратора.
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Пользователь успешно удален
        '400':
          description: Неверный формат UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Отсутствует или неверна кука токена доступа
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Недостаточно прав или удаление запрещено (нельзя удалить себя или другого администратора)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'