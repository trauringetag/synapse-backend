openapi: 3.0.3
info:
  title: Synapse API
  version: 1.0.29.2
  description: |
    REST API на Go (chi) с PostgreSQL для регистрации, аутентификации и ролевого
    управления пользователями. Спецификация полностью соответствует текущей
    реализации (`internal/infrastructure/transport/router.go`,
    `internal/delivery/http/handler`, `internal/infrastructure/middleware`).

    ## Аутентификация

    - Токены передаются **только в HttpOnly cookie**: `access_token` (короткий срок)
      и `refresh_token` (длинный срок). Заголовок `Authorization` не используется.
    - Cookie имеют `Path=/api/v1/`, `HttpOnly=true`, флаги `Secure` (`COOKIE_SECURE`)
      и `SameSite` (`COOKIE_SAMESITE`: Lax/Strict/None), опциональный `Domain` (`COOKIE_DOMAIN`).
    - JWT подписывается HS256 (`JWT_SECRET`, минимум 32 символа), `issuer=synapse-backend`,
      назначение токена (`access`/`refresh`) хранится в claim `aud`.
    - В БД хранится только SHA-256 хеш refresh-токена, не его исходное значение.
    - Схема безопасности `cookieAuth` требует валидную cookie `access_token`; middleware
      проверяет подпись/тип/срок токена и загружает пользователя из БД: он должен
      существовать и иметь статус `active`, роль также берется из БД на каждом запросе.
      Ошибка чтения БД закрывает доступ (`503 SERVICE_UNAVAILABLE`).

    ## CSRF и Origin

    - Все изменяющие запросы (`POST`, `PUT`, `PATCH`, `DELETE`) проходят через
      `middleware.CSRF`, включая публичные `/register`, `/register-admin`, `/login`,
      `/refresh`, `/logout`. Поэтому `security: []` означает отсутствие access/refresh
      аутентификации, но **не** отменяет CSRF-проверку.
    - Требуется разрешенный источник: `Origin` сверяется с allow-list `CORS_ORIGINS`;
      если `Origin` отсутствует, используется origin из `Referer`. При отсутствии обоих
      заголовков или при неразрешенном источнике — `403 FORBIDDEN`
      («Недопустимый Origin»). Разрешенный `Referer` не может переопределить явно
      запрещенный `Origin`.
    - Требуется cookie `csrf_token` и заголовок `X-CSRF-Token` со совпадающим значением
      (`hmac.Equal`). Токен имеет формат `nonce.HMAC-SHA256(nonce, JWT_SECRET)` и выдается
      `GET /api/v1/csrf` (cookie живет 1 час, `HttpOnly=false`).
    - `GET /api/v1/csrf` дополнительно защищен `middleware.RequireAllowedOrigin`:
      `Origin` обязателен, резервная проверка по `Referer` выполняется только когда
      `Origin` полностью отсутствует.
    - CORS настроен с `Access-Control-Allow-Credentials: true`, методами
      `GET, POST, PUT, PATCH, DELETE, OPTIONS` и заголовками
      `Accept, Content-Type, X-Admin-Token, X-Request-ID, X-CSRF-Token`, `MaxAge=300`.

    ## Общие правила транспорта

    - JSON тела ограничены 1 MiB (`middleware.LimitBody`, все методы кроме GET/HEAD/OPTIONS):
      превышение дает `413 PAYLOAD_TOO_LARGE` («Размер тела запроса превышает допустимый лимит»).
    - Декодер JSON отклоняет неизвестные поля (`DisallowUnknownFields`) и несколько JSON-значений
      в одном теле: `400 VALIDATION_FAILED` («Некорректное тело JSON»).
    - Ответы помечаются `X-Content-Type-Options: nosniff`; глобальные заголовки
      `Strict-Transport-Security: max-age=31536000; includeSubDomains; preload`,
      `X-Frame-Options: DENY`, `Referrer-Policy: strict-origin-when-cross-origin`.
    - Для всех путей под `/api/v1` действует `Cache-Control: no-store, no-cache, must-revalidate, private`
      и `Pragma: no-cache`. Служебные маршруты вне `/api/v1` возвращают
      `Cache-Control: no-store` (`/health`) или `public, max-age=300` (`/docs`, `/openapi.yaml`).
    - Форма ошибки: `{"error": "<категория>", "message": "<текст>", "details": {"поле": ["причина"]}}`,
      где `details` отсутствует, если деталей нет. Категории: `VALIDATION_FAILED` (400),
      `UNAUTHORIZED` (401), `FORBIDDEN` (403), `NOT_FOUND` (404), `CONFLICT` (409),
      `RATE_LIMITED` (429), `PAYLOAD_TOO_LARGE` (413), `INTERNAL_SERVER_ERROR` (500),
      `SERVICE_UNAVAILABLE` (503), `REQUEST_FAILED` (иной код).
    - Rate limiting хранится в PostgreSQL (`api_rate_limits`), fixed window, fail-closed:
      ошибка хранилища дает `503 SERVICE_UNAVAILABLE` («Проверка авторизации временно недоступна»),
      превышение — `429 RATE_LIMITED` («Слишком много запросов») с заголовком `Retry-After`
      (длительность окна в секундах).

    ## Таблица лимитов и ключей счетчиков (по факту router.go)

    | Маршрут | Окно | Порог (env) | Ключ счетчика |
    | --- | --- | --- | --- |
    | `POST /api/v1/login` (1-й limiter) | 15 минут | `LOGIN_RATE_LIMIT`, по умолчанию 10 | `login:<IP>:<нормализованный email>` |
    | `POST /api/v1/login` (2-й limiter) | 1 час | `LOGIN_RATE_LIMIT`, по умолчанию 10 | `login_global:<email>` либо `login_global:invalid:<IP>` |
    | `POST /api/v1/register` | 1 час | `REGISTER_RATE_LIMIT`, по умолчанию 10 | `ip:<IP>` |
    | `POST /api/v1/register-admin` | 1 час | `REGISTER_RATE_LIMIT`, по умолчанию 10 | `ip:<IP>` |
    | `POST /api/v1/refresh` | 1 минута | `REFRESH_RATE_LIMIT`, по умолчанию 30 | `refresh:<SHA-256 cookie>` либо `refresh:<IP>` |
    | `POST /api/v1/logout` | 1 минута | `LOGOUT_RATE_LIMIT`, по умолчанию 10 | `ip:<IP>` |
    | защищенные `/api/v1/users*` | 1 минута | `AUTHENTICATED_RATE_LIMIT`, по умолчанию 600 | `user:<UUID>` либо `ip:<IP>` |

    Логин защищен **двумя** последовательными фиксированными окнами: 10 запросов за
    15 минут на пару IP+email и 10 запросов за 1 час на email (при нераспознанном email —
    на IP). Счетчики увеличиваются на **каждом** запросе, включая успешный вход, поэтому
    реализация не эквивалентна политике «10 неуспешных попыток». Email извлекается из тела
    запроса (до 1 MiB); IP берется из `RemoteAddr` после `chimw.RealIP`, при размещении за
    reverse proxy доверие к `X-Forwarded-For` определяется конфигурацией прокси.

    ## Известные особенности реализации

    - `POST /api/v1/logout` не требует refresh-cookie: без нее возвращается `200` и cookie
      очищаются; при наличии cookie выполняется отзыв токена, ошибка БД дает `500`
      (cookie при этом все равно очищаются).
    - `POST /api/v1/refresh` при отказе (пустая/невалидная cookie, replay, неактивный
      пользователь) всегда сбрасывает auth-cookie и отвечает `401`; внутренняя ошибка
      ротации дает `500 INTERNAL_SERVER_ERROR` («Не удалось выпустить токены»).
      Повторное использование отозванного токена отзывает все сессии пользователя
      и логируется как `security_event=refresh_token_reuse`.
    - Поле `role` принимается только `POST /api/v1/users`; в `PUT`/`PATCH /api/v1/users/{id}`
      оно декодируется, но игнорируется (роль существующего пользователя не меняется).
    - Секрет админской регистрации читается только из заголовка `X-Admin-Token`;
      JSON-поля для секрета нет. Проверка выполняется после валидации полей.
    - Смена пароля через `PATCH /api/v1/users/{id}` отзывает все refresh-токены пользователя;
      `PUT /api/v1/users/{id}` с новым паролем сессии **не** отзывает.
    - Удаление собственного аккаунта и любого аккаунта с ролью `admin` запрещено (`403`).
servers:
  - url: /api/v1
    description: Версия API 1.0
tags:
  - name: Auth
    description: CSRF-токен, регистрация, вход, ротация токенов, выход
  - name: Users
    description: Собственный профиль и административное управление пользователями
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: access_token
      description: |
        HttpOnly JWT access-токена (HS256, aud=access). Требуется для защищенных маршрутов.
        Middleware проверяет подпись, тип и срок, затем загружает пользователя из БД
        (обязателен статус `active`, роль берется из БД).
    refreshCookie:
      type: apiKey
      in: cookie
      name: refresh_token
      description: |
        HttpOnly JWT refresh-токена (HS256, aud=refresh). Обязателен для `POST /refresh`;
        для `POST /logout` он необязателен (без cookie вызов все равно завершается успешно).
  schemas:
    User:
      type: object
      description: |
        Канонический ответ слоя пользователей (`domain.User`). Поле `password_hash`
        в JSON никогда не отдается (`json:"-"`).
      required:
        - id
        - email
        - role
        - status
        - first_name
        - last_name
        - created_at
        - updated_at
      properties:
        id:
          type: string
          format: uuid
          example: 5f0c7c2e-6b1a-4f3d-9a1d-2c7b6a5e4d31
        email:
          type: string
          format: email
          maxLength: 255
          description: Нормализуется сервером (обрезка пробелов, lowercase)
          example: ada@example.com
        role:
          type: string
          enum: [user, admin]
        status:
          type: string
          enum: [active, inactive]
          description: Созданные пользователи всегда получают статус `active`
        first_name:
          type: string
          minLength: 1
          maxLength: 255
          example: Ada
        last_name:
          type: string
          minLength: 1
          maxLength: 255
          example: Lovelace
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Error:
      type: object
      description: Единая форма ошибок HTTP-слоя (`response.ErrorBody`).
      required:
        - error
        - message
      properties:
        error:
          type: string
          description: Категория по HTTP-коду
          enum:
            - VALIDATION_FAILED
            - UNAUTHORIZED
            - FORBIDDEN
            - NOT_FOUND
            - CONFLICT
            - PAYLOAD_TOO_LARGE
            - RATE_LIMITED
            - INTERNAL_SERVER_ERROR
            - SERVICE_UNAVAILABLE
            - REQUEST_FAILED
          example: VALIDATION_FAILED
        message:
          type: string
          description: Человекочитаемое сообщение (русский словарь internal/messages)
          example: Проверьте обязательные поля пользователя
        details:
          type: object
          description: Ошибки валидации по полям; отсутствует, если деталей нет
          additionalProperties:
            type: array
            items:
              type: string
          example:
            email: ["Укажите действительный email"]
            password: ["Пароль должен содержать не менее 8 символов (либо была зафиксирована попытка ввести слишком длинный пароль)"]
    Message:
      type: object
      description: 'Короткий текстовый ответ вида {"message": "..."}.'
      required:
        - message
      properties:
        message:
          type: string
          example: Токены обновлены
    StatusResponse:
      type: object
      description: |
        Ответ служебного маршрута `GET /health` (вне `/api/v1`, поэтому не входит в
        операции этого документа): `{"status": "OK"}` с заголовками
        `Content-Type: application/json` и `Cache-Control: no-store`.
        Состояние БД в нем **не** проверяется.
      required:
        - status
      properties:
        status:
          type: string
          example: OK
    CsrfTokenResponse:
      type: object
      required:
        - csrf_token
      properties:
        csrf_token:
          type: string
          description: Значение формата `nonce.signature` (HMAC-SHA256 от JWT_SECRET)
          example: 9J2x...KfQ.uV1h...z3A
    RegisterRequest:
      type: object
      description: Тело `POST /register` и `POST /register-admin`. Неизвестные поля отклоняются.
      required: [email, password, first_name, last_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Обязателен, содержит `@`, нормализуется (trim + lowercase)
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: От 8 символов и не более 72 байт (ограничение bcrypt)
        first_name:
          type: string
          minLength: 1
          maxLength: 255
          description: Обрезается по краям, не может быть пустым
        last_name:
          type: string
          minLength: 1
          maxLength: 255
    LoginRequest:
      type: object
      description: |
        Тело `POST /login`. Оба поля обязательны (строки); email дополнительно
        ограничен 255 символами, пароль — 72 байтами, иначе ответ `400`
        с сообщением «Некорректное тело JSON».
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          maxLength: 72
    LoginResponse:
      type: object
      description: Ответ успешного входа. JWT в JSON не возвращаются — только в `Set-Cookie`.
      required: [message, user]
      properties:
        message:
          type: string
          example: Авторизация успешна
        user:
          $ref: '#/components/schemas/User'
    RefreshResponse:
      allOf:
        - $ref: '#/components/schemas/Message'
      description: 'Ответ `POST /refresh`: `{"message":"Токены обновлены"}`.'
    LogoutResponse:
      allOf:
        - $ref: '#/components/schemas/Message'
      description: 'Ответ `POST /logout`: `{"message":"Вышли из системы"}`.'
    CreateUserRequest:
      type: object
      description: |
        Тело `POST /users` (админ). `role` — единственное место, где роль задается явно;
        допускается `user` (по умолчанию) или `admin`, другие значения дают `400`.
      required: [email, password, first_name, last_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
        first_name:
          type: string
          minLength: 1
          maxLength: 255
        last_name:
          type: string
          minLength: 1
          maxLength: 255
        role:
          type: string
          enum: [user, admin]
          default: user
          description: Необязательное поле; пустая строка трактуется как `user`
    UpdateUserRequest:
      type: object
      description: |
        Тело `PUT /users/{id}` (админ, полная замена редактируемых полей).
        Все пять полей обязательны. Поле `role` принимается декодером, но игнорируется:
        роль пользователя остается прежней.
      required: [email, password, first_name, last_name, status]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Новый bcrypt-хеш записывается всегда
        first_name:
          type: string
          minLength: 1
          maxLength: 255
        last_name:
          type: string
          minLength: 1
          maxLength: 255
        status:
          type: string
          enum: [active, inactive]
        role:
          type: string
          description: Игнорируется сервером (роль через PUT не меняется)
          nullable: true
    PatchUserRequest:
      type: object
      description: |
        Тело `PATCH /users/{id}` (админ). Все поля необязательны, но хотя бы одно
        обязательно. Пустое тело дает `400` («Пустые данные обновления»,
        `details.body = ["Укажите хотя бы одно поле"]`).
      minProperties: 1
      properties:
        email:
          type: string
          format: email
          maxLength: 255
          description: Пустое или невалидное значение отклоняется
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: При смене пароля все refresh-токены пользователя отзываются
        first_name:
          type: string
          minLength: 1
          maxLength: 255
        last_name:
          type: string
          minLength: 1
          maxLength: 255
        status:
          type: string
          enum: [active, inactive]
    UpdateMeRequest:
      type: object
      description: |
        Тело `PUT /users/me` — полная замена профиля самим пользователем.
        Роль и статус изменять нельзя; неизвестные поля (например `role`, `status`,
        `password`) отклоняются с `400`.
      required: [email, first_name, last_name]
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        first_name:
          type: string
          minLength: 1
          maxLength: 255
        last_name:
          type: string
          minLength: 1
          maxLength: 255
    PatchMeRequest:
      type: object
      description: |
        Тело `PATCH /users/me` — частичное обновление профиля. Хотя бы одно поле
        обязательно; пустое тело дает `400`.
      minProperties: 1
      properties:
        email:
          type: string
          format: email
          maxLength: 255
        first_name:
          type: string
          minLength: 1
          maxLength: 255
        last_name:
          type: string
          minLength: 1
          maxLength: 255
    UserListResponse:
      type: object
      description: Страница пользователей с метаданными пагинации.
      required: [items, page, limit, total, total_pages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/User'
        page:
          type: integer
          minimum: 1
          description: Фактически примененная страница
        limit:
          type: integer
          minimum: 1
          maximum: 100
          description: Фактически примененный размер страницы
        total:
          type: integer
          format: int64
          description: Общее число пользователей, удовлетворяющих фильтрам
        total_pages:
          type: integer
          format: int64
          description: ceil(total / limit); при total = 0 равен 0
  headers:
    SetCookieAuth:
      description: |
        `Set-Cookie` для `access_token` и `refresh_token`: `HttpOnly`,
        `Path=/api/v1/`, `Secure` по `COOKIE_SECURE`, `SameSite` по `COOKIE_SAMESITE`,
        опциональный `Domain`, `Max-Age` по срокам токенов.
      schema:
        type: string
    SetCookieCleared:
      description: Те же cookie, сброшенные до истекших (`Max-Age=-1`, `Expires=Thu, 01 Jan 1970`).
      schema:
        type: string
    SetCookieCsrf:
      description: |
        `csrf_token=<значение>; Path=/api/v1/; Max-Age=3600; SameSite=<COOKIE_SAMESITE>;
        Secure=<COOKIE_SECURE>` — намеренно **без** `HttpOnly`, чтобы frontend мог прочитать токен.
      schema:
        type: string
    CacheControlNoStore:
      description: |
        Устанавливается middleware `CacheControl` для всего `/api/v1`
        (заголовок присутствует и в ответах с ошибкой).
      schema:
        type: string
        example: no-store, no-cache, must-revalidate, private
    RetryAfter:
      description: Длительность текущего окна лимитера в секундах (например `900`, `3600`, `60`).
      schema:
        type: integer
  parameters:
    UserId:
      in: path
      name: id
      required: true
      description: UUID пользователя. Невалидный формат дает `400` («Неверный идентификатор пользователя»).
      schema:
        type: string
        format: uuid
    Page:
      in: query
      name: page
      required: false
      description: |
        Номер страницы. Целое >= 1, по умолчанию `1`. Неразбираемое значение или `< 1`
        дают `400` с `details.page = ["Значение должно быть положительным числом"]`.
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      in: query
      name: limit
      required: false
      description: |
        Размер страницы, от 1 до 100, по умолчанию `10`. Вне диапазона — `400`
        с `details.limit = ["Значение должно быть от 1 до 100"]`.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    Search:
      in: query
      name: search
      required: false
      description: |
        Поиск по email, имени, фамилии и строке «имя фамилия»: `ILIKE '%значение%'`
        плюс полнотекстовый поиск `to_tsvector('simple', ...)`. Значение обрезается,
        регистр фильтров `role`/`status` не учитывается. Длиннее 200 символов — `400`.
      schema:
        type: string
        maxLength: 200
    RoleFilter:
      in: query
      name: role
      required: false
      description: Фильтр по роли (`user` или `admin`); недопустимое значение дает `400`.
      schema:
        type: string
        enum: [user, admin]
    StatusFilter:
      in: query
      name: status
      required: false
      description: Фильтр по статусу (`active` или `inactive`); недопустимое значение дает `400`.
      schema:
        type: string
        enum: [active, inactive]
  responses:
    BadRequest:
      description: |
        `400 VALIDATION_FAILED` — неверный запрос: невалидные поля, неизвестные поля JSON,
        некорректный JSON или несколько значений в теле, неверный UUID, недопустимые
        query-параметры, превышение длины `search`, пустое тело PATCH.
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            validation:
              summary: Ошибка валидации полей
              value:
                error: VALIDATION_FAILED
                message: Проверьте обязательные поля пользователя
                details:
                  email: ["Укажите действительный email"]
                  password: ["Пароль должен содержать не менее 8 символов (либо была зафиксирована попытка ввести слишком длинный пароль)"]
                  first_name: ["Имя обязательно для заполнения"]
                  last_name: ["Фамилия обязательна для заполнения"]
            json:
              summary: Некорректное тело
              value:
                error: VALIDATION_FAILED
                message: Некорректное тело JSON
            pagination:
              summary: Недопустимые параметры пагинации
              value:
                error: VALIDATION_FAILED
                message: Недопустимые параметры ограничения количества страниц
                details:
                  limit: ["Значение должно быть от 1 до 100"]
            uuid:
              summary: Неверный идентификатор пользователя
              value:
                error: VALIDATION_FAILED
                message: Неверный идентификатор пользователя
            parameter:
              summary: Недопустимое значение фильтра
              value:
                error: VALIDATION_FAILED
                message: Недопустимое значение параметра
                details:
                  role: ["Допустимые значения: user, admin"]
    Unauthorized:
      description: |
        `401 UNAUTHORIZED` — отсутствие или недействительность аутентификации.
        Возможные сообщения: «Необходима авторизация для получения доступа»,
        «Недействительный или просроченный Access-токен», «Недопустимый токен субъекта»,
        «Не авторизован» (пользователь удален или неактивен),
        «Неверные данные авторизации (email или пароль)»,
        «Отсутствует Cookie-файл Refresh-токена»,
        «Недействительный или просроченный Refresh-токен».
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: UNAUTHORIZED
            message: Недействительный или просроченный Access-токен
    Forbidden:
      description: |
        `403 FORBIDDEN` — запрет по политике безопасности. Возможные сообщения:
        «Недопустимый Origin» (CSRF/Origin middleware), «Недействительный CSRF-токен»,
        «Недостаточно прав» (роль из БД не подходит), «Доступ к данному контуру ограничен»
        (неверный `X-Admin-Token`), «Администратор не может удалить собственную учетную запись»,
        «Нельзя удалить учетную запись администратора».
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: FORBIDDEN
            message: Недостаточно прав
    NotFound:
      description: |
        `404 NOT_FOUND` — ресурс не найден. Сообщение «Пользователь не найден»
        (для защищенных маршрутов пользователь мог быть удален между запросами).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: NOT_FOUND
            message: Пользователь не найден
    Conflict:
      description: '`409 CONFLICT` — email уже используется (уникальность `users.email`).'
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: CONFLICT
            message: Email уже используется
    PayloadTooLarge:
      description: |
        `413 PAYLOAD_TOO_LARGE` — тело запроса больше 1 MiB (`http.MaxBytesError`
        при декодировании или переполнение буфера лимитера).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: PAYLOAD_TOO_LARGE
            message: Размер тела запроса превышает допустимый лимит
    RateLimited:
      description: |
        `429 RATE_LIMITED` — превышен порог fixed-window лимитера («Слишком много запросов»),
        `Retry-After` равен длительности окна в секундах.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: RATE_LIMITED
            message: Слишком много запросов
    InternalServerError:
      description: |
        `500 INTERNAL_SERVER_ERROR` — внутренняя ошибка приложения. Сообщения:
        «Не удалось создать пользователя», «Не удалось получить пользователя»,
        «Не удалось получить список пользователей», «Не удалось обновить пользователя»,
        «Не удалось удалить пользователя», «Не удалось хешировать пароль»,
        «Не удалось выпустить токены», «Не удалось завершить сессию. Повторите попытку позже»,
        «Не удалось подготовить CSRF-защиту запроса». Также возникает при неклассифицированных
        паниках/ошибках (`chimw.Recoverer`).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: INTERNAL_SERVER_ERROR
            message: Не удалось обновить пользователя
    ServiceUnavailable:
      description: |
        `503 SERVICE_UNAVAILABLE` — зависимость недоступна, сообщение всегда одно:
        «Проверка авторизации временно недоступна». Причины: ошибка БД при загрузке
        пользователя в middleware аутентификации, ошибка `GetByEmail` при входе,
        ошибка или некорректная конфигурация rate-limit хранилища (fail-closed).
      headers:
        Cache-Control:
          $ref: '#/components/headers/CacheControlNoStore'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error: SERVICE_UNAVAILABLE
            message: Проверка авторизации временно недоступна
paths:
  /csrf:
    get:
      tags: [Auth]
      summary: Выдача CSRF-токена и cookie
      description: |
        Возвращает подписанный токен `nonce.HMAC-SHA256(nonce, JWT_SECRET)` и устанавливает
        cookie `csrf_token` (`Path=/api/v1/`, `Max-Age=3600`, **не** HttpOnly).
        Защищен `RequireAllowedOrigin`: требуется `Origin` из `CORS_ORIGINS`;
        при отсутствии `Origin` допускается `Referer`. Оба заголовка отсутствуют или
        источник неразрешен — `403`. Access/refresh-аутентификация не требуется,
        лимитер не применяется.
      operationId: getCsrfToken
      security: []
      responses:
        '200':
          description: Токен выдан
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieCsrf'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfTokenResponse'
              example:
                csrf_token: 9J2x...KfQ.uV1h...z3A
        '403':
          description: Отсутствует или неразрешен источник запроса
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: FORBIDDEN
                message: Недопустимый Origin
        '500':
          description: Не удалось сгенерировать CSRF-токен
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: INTERNAL_SERVER_ERROR
                message: Не удалось подготовить CSRF-защиту запроса
  /register:
    post:
      tags: [Auth]
      summary: Регистрация обычного пользователя
      description: |
        Создает пользователя с ролью `user` и статусом `active`. Требует CSRF
        (cookie `csrf_token` + `X-CSRF-Token`) и разрешенный Origin/Referer.
        Лимитер — 10 запросов в час на IP. Пароль хешируется bcrypt (DefaultCost).
        Cookie при регистрации не устанавливаются.
      operationId: registerUser
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              email: ada@example.com
              password: a-long-password
              first_name: Ada
              last_name: Lovelace
      responses:
        '201':
          description: Пользователь создан
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /register-admin:
    post:
      tags: [Auth]
      summary: Регистрация администратора по секрету
      description: |
        Создает пользователя с ролью `admin`. Секрет передается **только** в заголовке
        `X-Admin-Token` (значение `ADMIN_REGISTER_TOKEN`) и сравнивается constant-time.
        Порядок проверок: сначала валидация полей (`400`), затем секрет (`403`).
        Требует CSRF и разрешенный Origin/Referer; лимитер — 10 запросов в час на IP.
      operationId: registerAdmin
      security: []
      parameters:
        - in: header
          name: X-Admin-Token
          required: false
          description: |
            Секрет регистрации администраторов. Отсутствие или несовпадение дают `403`
            («Доступ к данному контуру ограничен»).
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Администратор создан
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
              example:
                id: 5f0c7c2e-6b1a-4f3d-9a1d-2c7b6a5e4d31
                email: root@example.com
                role: admin
                status: active
                first_name: Grace
                last_name: Hopper
                created_at: "2026-01-01T00:00:00Z"
                updated_at: "2026-01-01T00:00:00Z"
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: |
            `403 FORBIDDEN` — неверный `X-Admin-Token`
            («Доступ к данному контуру ограничен») либо ошибка CSRF/Origin.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: FORBIDDEN
                message: Доступ к данному контуру ограничен
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /login:
    post:
      tags: [Auth]
      summary: Вход в систему
      description: |
        Проверяет учетные данные (bcrypt, с защитой от timing-атак через фиктивный хеш),
        убеждается что пользователь активен, выпускает JWT-пару и сохраняет SHA-256 хеш
        refresh-токена в БД. При успехе устанавливает HttpOnly cookie `access_token`
        и `refresh_token`. Требует CSRF и разрешенный Origin/Referer.
        Лимитеры: 10 запросов за 15 минут на IP+email и 10 запросов за час на email;
        счетчик растет на любом запросе, включая успешный вход.
        Неверные учетные данные и несуществующий пользователь дают одинаковый `401`.
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: ada@example.com
              password: a-long-password
      responses:
        '200':
          description: Вход выполнен, cookie установлены
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAuth'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: |
            `400 VALIDATION_FAILED` — некорректный JSON/неизвестные поля/превышение
            тела, либо email > 255 символов или пароль > 72 байт
            (в этом случае сообщение «Некорректное тело JSON»).
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: VALIDATION_FAILED
                message: Некорректное тело JSON
        '401':
          description: Неверные учетные данные или вход запрещен (пользователь неактивен/удален)
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: UNAUTHORIZED
                message: Неверные данные авторизации (email или пароль)
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Не удалось выпустить токены или сохранить refresh-токен
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: INTERNAL_SERVER_ERROR
                message: Не удалось выпустить токены
        '503':
          description: БД недоступна при поиске пользователя или при ошибке/некорректной конфигурации лимитера
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: SERVICE_UNAVAILABLE
                message: Проверка авторизации временно недоступна
  /refresh:
    post:
      tags: [Auth]
      summary: Ротация access/refresh токенов
      description: |
        **Требуется cookie `refresh_token`** (заголовок `Authorization` не используется).
        Сервер проверяет JWT (тип `refresh`), затем в транзакцииатомарно отзывает старый
        токен по его SHA-256 хешу, проверяет активность пользователя (`FOR UPDATE`)
        и записывает новый хеш. При успехе устанавливает новую пару cookie.
        Любой отказ (пустая/невалидная/просроченная cookie, unknown hash, replay,
        неактивный пользователь) приводит к сбросу auth-cookie и `401`.
        Replay отзывает все сессии пользователя. Требуются CSRF и разрешенный Origin/Referer.
        Лимитер — 30 запросов в минуту по хешу cookie (по IP, если cookie нет).
      operationId: refreshTokens
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Новые cookie установлены
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieAuth'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshResponse'
              example:
                message: Токены обновлены
        '401':
          description: |
            Refresh-токен отсутствует, недействителен, просрочен, отозван (replay)
            или принадлежит неактивому/удаленному пользователю. Auth-cookie сброшены.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieCleared'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: UNAUTHORIZED
                message: Недействительный или просроченный Refresh-токен
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Ошибка ротации токенов (cookie при этом сброшены)
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieCleared'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: INTERNAL_SERVER_ERROR
                message: Не удалось выпустить токены
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /logout:
    post:
      tags: [Auth]
      summary: Выход из системы
      description: |
        Очищает cookie `access_token` и `refresh_token`. Если cookie `refresh_token`
        присутствует, отзывает соответствующий токен в БД; без cookie вызов все равно
        завершается `200` (ничего не отзывается). Требуются CSRF и разрешенный Origin/Referer.
        Лимитер — 10 запросов в минуту на IP.
      operationId: logout
      security:
        - refreshCookie: []
      responses:
        '200':
          description: Выход выполнен, cookie очищены
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieCleared'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
              example:
                message: Вышли из системы
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: |
            Не удалось отозвать refresh-токен в БД. Auth-cookie все равно очищаются.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetCookieCleared'
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: INTERNAL_SERVER_ERROR
                message: Не удалось завершить сессию. Повторите попытку позже
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /users/me:
    get:
      tags: [Users]
      summary: Профиль текущего пользователя
      description: |
        Требует валидную cookie `access_token` и активный аккаунт; доступен ролям
        `user` и `admin`. Возвращает актуальную запись из БД (роль и статус тоже читаются
        из БД). Дополнительно действует общий лимитер авторизованных запросов —
        600 запросов в минуту на пользователя.
      operationId: getMe
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Текущий пользователь
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            `403 FORBIDDEN` («Недостаточно прав») — только если роль в контексте запроса
            не `user` и не `admin`; на практике недостижимо при текущих значениях роли в БД.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Пользователь не найден (аккаунт удален после прохождения middleware)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Ошибка чтения пользователя из БД
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: INTERNAL_SERVER_ERROR
                message: Не удалось получить пользователя
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [Users]
      summary: Полная замена собственного профиля
      description: |
        Заменяет email, имя и фамилию текущего пользователя. Роль и статус изменить нельзя;
        поля `password`, `role`, `status` в теле не принимаются (неизвестные поля → `400`).
        `updated_at` обновляется только при фактическом изменении значений.
        Требуются CSRF и разрешенный Origin/Referer.
      operationId: replaceMe
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMeRequest'
            example:
              email: ada.lovelace@example.com
              first_name: Ada
              last_name: Lovelace-Byron
      responses:
        '200':
          description: Профиль обновлен
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Ошибка обновления профиля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: INTERNAL_SERVER_ERROR
                message: Не удалось обновить пользователя
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [Users]
      summary: Частичное обновление собственного профиля
      description: |
        Обновляет переданные поля (`email`, `first_name`, `last_name`). Пустое тело
        или тело без одного из этих полей дает `400` («Пустые данные обновления»,
        `details.body = ["Укажите хотя бы одно поле"]`). Роль и статус недоступны.
        Требуются CSRF и разрешенный Origin/Referer.
      operationId: patchMe
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchMeRequest'
            example:
              first_name: Ada King
      responses:
        '200':
          description: Профиль обновлен
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: |
            `400 VALIDATION_FAILED` — пустое тело обновления, пустые/невалидные значения
            полей или неизвестные поля.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: VALIDATION_FAILED
                message: Пустые данные обновления
                details:
                  body: ["Укажите хотя бы одно поле"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Пользователь не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Ошибка обновления профиля
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /users:
    get:
      tags: [Users]
      summary: Список пользователей (админ)
      description: |
        Только роль `admin`. Сортировка — `created_at ASC`. Фильтры и пагинация описаны
        в параметрах; значения `role`/`status` нормализуются (trim + lowercase).
        Требуются cookie `access_token`, CSRF не нужен (метод GET), действует общий
        лимитер авторизованных запросов.
      operationId: listUsers
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - $ref: '#/components/parameters/RoleFilter'
        - $ref: '#/components/parameters/StatusFilter'
      responses:
        '200':
          description: Страница пользователей
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
              example:
                items:
                  - id: 5f0c7c2e-6b1a-4f3d-9a1d-2c7b6a5e4d31
                    email: ada@example.com
                    role: user
                    status: active
                    first_name: Ada
                    last_name: Lovelace
                    created_at: "2026-01-01T00:00:00Z"
                    updated_at: "2026-01-01T00:00:00Z"
                page: 1
                limit: 10
                total: 1
                total_pages: 1
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Роль в БД не `admin`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: FORBIDDEN
                message: Недостаточно прав
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Ошибка чтения списка пользователей
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: INTERNAL_SERVER_ERROR
                message: Не удалось получить список пользователей
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    post:
      tags: [Users]
      summary: Создание пользователя (админ)
      description: |
        Только роль `admin`. Создает пользователя с указанной ролью (`user` по умолчанию)
        и статусом `active`. Пароль хешируется bcrypt. Требуются CSRF и разрешенный
        Origin/Referer, а также cookie `access_token`.
      operationId: createUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            example:
              email: new.user@example.com
              password: a-long-password
              first_name: Alan
              last_name: Turing
              role: user
      responses:
        '201':
          description: Пользователь создан
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Ошибка хеширования пароля или создания пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: INTERNAL_SERVER_ERROR
                message: Не удалось создать пользователя
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'
    get:
      tags: [Users]
      summary: Получение пользователя по ID (админ)
      description: Только роль `admin`. Метод GET, CSRF не требуется.
      operationId: getUserById
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Пользователь
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Неверный формат UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: VALIDATION_FAILED
                message: Неверный идентификатор пользователя
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Ошибка чтения пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    put:
      tags: [Users]
      summary: Полная замена данных пользователя (админ)
      description: |
        Только роль `admin`. Обязательны `email`, `password`, `first_name`, `last_name`,
        `status`. Хеш пароля перезаписывается всегда. Существующая роль сохраняется:
        принятое, но игнорируемое поле `role` не является способом повышения/понижения.
        Сессии (refresh-токены) пользователя при этом **не** отзываются.
        Требуются CSRF и разрешенный Origin/Referer.
      operationId: replaceUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            example:
              email: alan@example.com
              password: another-long-password
              first_name: Alan
              last_name: Turing
              status: active
      responses:
        '200':
          description: Данные пользователя обновлены
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Ошибка хеширования пароля или обновления пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    patch:
      tags: [Users]
      summary: Частичное обновление данных пользователя (админ)
      description: |
        Только роль `admin`. Допустимы `email`, `password`, `first_name`, `last_name`,
        `status`; нужно передать хотя бы одно поле. Поле `role` игнорируется.
        При смене пароля все refresh-токены пользователя отзываются (ошибка отзыва
        только логируется и не меняет успешный ответ). Требуются CSRF и разрешенный Origin/Referer.
      operationId: patchUser
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchUserRequest'
            example:
              status: inactive
      responses:
        '200':
          description: Данные пользователя обновлены
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: |
            `400 VALIDATION_FAILED` — пустое тело обновления, невалидное значение поля
            или недопустимый `status`.
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: VALIDATION_FAILED
                message: Недопустимое значение параметра
                details:
                  status: ["Допустимые значения: active, inactive"]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Ошибка хеширования пароля или обновления пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
    delete:
      tags: [Users]
      summary: Удаление пользователя (админ)
      description: |
        Только роль `admin`. Нельзя удалить собственную учетную запись (`403`,
        «Администратор не может удалить собственную учетную запись») и любой аккаунт
        с ролью `admin` (`403`, «Нельзя удалить учетную запись администратора» —
        репозиторий возвращает `domain.ErrProtected`). Каскадно удаляются refresh-токены
        пользователя. Требуются CSRF и разрешенный Origin/Referer.
      operationId: deleteUser
      security:
        - cookieAuth: []
      responses:
        '204':
          description: Пользователь удален (тело ответа отсутствует)
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
        '400':
          description: Неверный формат UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Недостаточно прав либо удаление защищенной учетной записи
          headers:
            Cache-Control:
              $ref: '#/components/headers/CacheControlNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: FORBIDDEN
                message: Нельзя удалить учетную запись администратора
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          description: Ошибка удаления пользователя
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error: INTERNAL_SERVER_ERROR
                message: Не удалось удалить пользователя
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
