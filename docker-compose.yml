services:
  postgres:
    container_name: synapse-db
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-synapse-default-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-synapse-default-password}
      POSTGRES_DB: ${POSTGRES_DB:-synapse-default-db}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./internal/db/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-synapse-default-user} -d ${POSTGRES_DB:-synapse-default-db}" ]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: synapse-api
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      APP_PORT: "8080"
      POSTGRES_HOST: postgres
      DATABASE_URL: postgres://${POSTGRES_USER:-synapse-default-user}:${POSTGRES_PASSWORD:-synapse-default-password}@postgres:5432/${POSTGRES_DB:-synapse-default-db}?sslmode=disable
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1:8080/health" ]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata: